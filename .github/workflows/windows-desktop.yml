name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "scripts/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Build API sidecar
        shell: pwsh
        run: .\scripts\build-sidecar.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        run: npm run desktop:build

      - name: Stage release installer
        shell: pwsh
        run: |
          $nsisDir = "frontend\src-tauri\target\release\bundle\nsis"
          $setup = Get-ChildItem $nsisDir -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "No NSIS installer found in $nsisDir" }
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $version = (Get-Content frontend\src-tauri\tauri.conf.json | ConvertFrom-Json).version
          $named = "TinyLM-Council-$version-Windows-Setup.exe"
          Copy-Item -Force $setup.FullName (Join-Path "dist-release" $named)
          Copy-Item -Force $setup.FullName (Join-Path "dist-release" "TinyLM-Council-Windows-Setup.exe")
          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinylm-council-windows-nsis
          path: dist-release/*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/TinyLM-Council-*-Windows-Setup.exe
            dist-release/TinyLM-Council-Windows-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
